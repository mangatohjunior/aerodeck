name: Droplet Operations & Diagnostics

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Operation to perform"
        required: true
        type: choice
        default: "diagnose"
        options:
          - "diagnose"
          - "restart-all"
          - "restart-worker"

permissions:
  contents: read

concurrency:
  group: droplet-ops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ops:
    name: droplet operations
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Authorize runner IP in DigitalOcean firewall
        shell: bash
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          if [ -z "${DIGITALOCEAN_TOKEN:-}" ]; then
            exit 0
          fi
          python - << 'PY'
          import json, os, time, urllib.request
          token = os.environ["DIGITALOCEAN_TOKEN"]
          ip = urllib.request.urlopen("https://api.ipify.org", timeout=10).read().decode().strip()
          cidr = f"{ip}/32"
          req = urllib.request.Request(
              "https://api.digitalocean.com/v2/firewalls",
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
          )
          data = json.loads(urllib.request.urlopen(req, timeout=15).read().decode())
          for fw in data.get("firewalls", []):
              if "control-fw" not in fw.get("name", ""):
                  continue
              addrs = [
                  a
                  for r in fw.get("inbound_rules", [])
                  if str(r.get("ports")) == "22"
                  for a in r.get("sources", {}).get("addresses", [])
              ]
              if cidr not in addrs:
                  rule_req = urllib.request.Request(
                      f"https://api.digitalocean.com/v2/firewalls/{fw['id']}/rules",
                      data=json.dumps({
                          "inbound_rules": [{
                              "protocol": "tcp",
                              "ports": "22",
                              "sources": {"addresses": [cidr]},
                          }]
                      }).encode(),
                      headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
                      method="POST",
                  )
                  urllib.request.urlopen(rule_req, timeout=15)
                  print(f"Added {cidr} to firewall {fw['name']}; waiting 5s for propagation...")
                  time.sleep(5)
              else:
                  print(f"{cidr} already allowed in {fw['name']}")
          PY

      - name: Execute action on Droplet
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
          CONTROL_DROPLET_HOST: ${{ vars.CONTROL_DROPLET_HOST }}
          CONTROL_SSH_KEY_PATH: ${{ vars.CONTROL_SSH_KEY_PATH }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          if [ -z "${CONTROL_DROPLET_HOST:-}" ]; then
            echo "::error::CONTROL_DROPLET_HOST variable is not set."
            exit 1
          fi
          key_path="${CONTROL_SSH_KEY_PATH:-$HOME/.ssh/aerodeck_ed25519}"
          ssh_opts=(-i "${key_path}" -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15)

          if [ "${ACTION}" = "diagnose" ]; then
            echo "=== RUNNING DIAGNOSTICS ON ${CONTROL_DROPLET_HOST} ==="
            ssh "${ssh_opts[@]}" "root@${CONTROL_DROPLET_HOST}" '
              echo "--- CONTAINER STATUS ---"
              docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Ports}}"
              echo ""
              echo "--- AERODECK-API LOGS (LAST 80 LINES) ---"
              docker logs --tail 80 aerodeck-api 2>&1 || true
              echo ""
              echo "--- AERODECK-DASHBOARD LOGS (LAST 80 LINES) ---"
              docker logs --tail 80 aerodeck-dashboard 2>&1 || true
              echo ""
              echo "--- AERODECK-WORKER LOGS (LAST 80 LINES) ---"
              docker logs --tail 80 aerodeck-worker 2>&1 || true
              echo ""
              echo "--- DB TABLES (PROJECTS, ENVIRONMENTS, DEPLOYMENTS) ---"
              printf "%s" "" | base64 -d | docker exec -i aerodeck-api python3 || true
              echo ""
              echo "--- REDIS KEYS & LOG STREAMS ---"
              docker exec aerodeck-redis redis-cli keys "*" 2>&1 || true
            '
          elif [ "${ACTION}" = "restart-all" ]; then
            echo "=== RESTARTING ALL CONTROL PLANE SERVICES ON ${CONTROL_DROPLET_HOST} ==="
            ssh "${ssh_opts[@]}" "root@${CONTROL_DROPLET_HOST}" '
              echo "logging into DOCR..."
              token="$(set -a; [ -f /etc/aerodeck/control-plane.env ] && source /etc/aerodeck/control-plane.env; printf "%s" "${AERODECK_DIGITALOCEAN_TOKEN:-}")"
              if [ -n "${token}" ]; then
                printf "%s" "${token}" | docker login registry.digitalocean.com --username "${token}" --password-stdin >/dev/null 2>&1 || true
              fi
              echo "pulling latest control-plane image..."
              docker pull registry.digitalocean.com/aerodeck/control-plane:main
              echo "restarting control-plane API + worker..."
              if [ -f /root/start-on-droplet.sh ]; then
                bash /root/start-on-droplet.sh
              fi
              echo "restarting dashboard..."
              if [ -f /root/aerodeck/start-dashboard-on-droplet.sh ]; then
                bash /root/aerodeck/start-dashboard-on-droplet.sh
              elif [ -f /root/start-dashboard-on-droplet.sh ]; then
                bash /root/start-dashboard-on-droplet.sh
              fi
              echo "--- UPDATED CONTAINER STATUS ---"
              docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Ports}}"
            '
          elif [ "${ACTION}" = "restart-worker" ]; then
            echo "=== RESTARTING AERODECK-WORKER ON ${CONTROL_DROPLET_HOST} ==="
            ssh "${ssh_opts[@]}" "root@${CONTROL_DROPLET_HOST}" '
              echo "logging into DOCR..."
              token="$(set -a; [ -f /etc/aerodeck/control-plane.env ] && source /etc/aerodeck/control-plane.env; printf "%s" "${AERODECK_DIGITALOCEAN_TOKEN:-}")"
              if [ -n "${token}" ]; then
                printf "%s" "${token}" | docker login registry.digitalocean.com --username "${token}" --password-stdin >/dev/null 2>&1 || true
              fi
              echo "pulling latest control-plane image..."
              docker pull registry.digitalocean.com/aerodeck/control-plane:main
              if [ -f /root/aerodeck/configure-iac-worker.sh ]; then
                bash /root/aerodeck/configure-iac-worker.sh
              else
                docker restart aerodeck-worker
              fi
              docker ps -a --filter name=aerodeck-worker
            '
          fi
