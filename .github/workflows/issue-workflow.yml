name: Issue workflow

# Jira-style status transitions for AeroDeck issues.
#
# Labels, exactly one at a time:
#   status: backlog → status: to-do → status: in-progress → status: in-review → status: done
#
# What moves a card:
#   - someone is assigned                         → status: in-progress
#   - a pull request references the issue with
#     Closes / Fixes / Resolves #<n>              → status: in-review
#   - that pull request is merged, or the issue
#     is closed                                   → status: done
#   - the pull request is closed without merging  → status: in-progress
#   - the issue is reopened                       → status: to-do
#
# Forward moves never drag a card backwards, except the two explicit
# regressions above (unmerged pull request, and reopen).

on:
  issues:
    types: [assigned, closed, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  transition:
    name: Move issue status
    runs-on: ubuntu-latest
    steps:
      - name: Apply status label
        uses: actions/github-script@v7
        with:
          script: |
            const STATUS = [
              "status: backlog",
              "status: to-do",
              "status: in-progress",
              "status: in-review",
              "status: done",
            ];
            const RANK = Object.fromEntries(STATUS.map((name, index) => [name, index]));
            const { owner, repo } = context.repo;

            function currentStatus(labels) {
              const names = labels.map((label) => (typeof label === "string" ? label : label.name));
              return STATUS.find((name) => names.includes(name)) || null;
            }

            async function setStatus(issueNumber, target, { allowBackward = false } = {}) {
              const { data } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber,
              });
              if (data.pull_request) return;

              const now = currentStatus(data.labels);
              if (now === target) return;
              if (!allowBackward && now && RANK[now] > RANK[target]) {
                core.info(`#${issueNumber} stays at ${now}; not moving back to ${target}`);
                return;
              }

              for (const name of STATUS) {
                if (name === target || name !== now) continue;
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name,
                });
              }
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: [target],
              });
              core.info(`#${issueNumber} ${now || "(none)"} → ${target}`);
            }

            function linkedIssues(body) {
              const pattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
              const numbers = new Set();
              for (const match of body.matchAll(pattern)) numbers.add(Number(match[1]));
              return [...numbers];
            }

            const event = context.eventName;
            const action = context.payload.action;

            if (event === "issues") {
              const number = context.payload.issue.number;
              if (action === "assigned") await setStatus(number, "status: in-progress");
              if (action === "closed") await setStatus(number, "status: done");
              if (action === "reopened") await setStatus(number, "status: to-do", { allowBackward: true });
              return;
            }

            if (event === "pull_request") {
              const pullRequest = context.payload.pull_request;
              const numbers = linkedIssues(`${pullRequest.title}\n${pullRequest.body || ""}`);
              if (numbers.length === 0) {
                core.info("Pull request does not reference an issue with Closes/Fixes/Resolves #n");
                return;
              }
              const merged = action === "closed" && pullRequest.merged === true;
              const abandoned = action === "closed" && pullRequest.merged !== true;
              for (const number of numbers) {
                if (merged) await setStatus(number, "status: done");
                else if (abandoned) await setStatus(number, "status: in-progress", { allowBackward: true });
                else await setStatus(number, "status: in-review");
              }
            }
