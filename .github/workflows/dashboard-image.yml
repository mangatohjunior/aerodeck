name: Dashboard image

# Build apps/dashboard on every PR that touches it. Push to DigitalOcean
# Container Registry only from main inside the single Starter repository
# (`control-plane`), tagged as `dashboard-<git-sha>` and `dashboard-main`,
# pruning older digests so the Starter registry stays within its 1-repository /
# 5-image cap. When DEPLOY_DASHBOARD_SELF_HOSTED=true and CONTROL_DROPLET_HOST
# are set, a self-hosted runner on the operator machine pulls the image on the
# control Droplet and restarts aerodeck-dashboard.

on:
  pull_request:
    paths:
      - "apps/dashboard/**"
      - "apps/control-plane/scripts/start-dashboard-on-droplet.sh"
      - ".github/workflows/dashboard-image.yml"
      - "packages/iac-engine/tests/test_image_publish.py"
  push:
    branches: [main]
    paths:
      - "apps/dashboard/**"
      - "apps/control-plane/scripts/start-dashboard-on-droplet.sh"
      - ".github/workflows/dashboard-image.yml"
      - "packages/iac-engine/tests/test_image_publish.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-image-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCR_NAME: ${{ vars.DOCR_NAME }}
  IMAGE_REPO: control-plane
  DOCKER_BUILDKIT: "1"

jobs:
  build:
    name: build dashboard image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Workflow and Dockerfile shape
        run: python packages/iac-engine/tests/test_image_publish.py

      - name: Build
        run: |
          set -euo pipefail
          docker build \
            --file apps/dashboard/Dockerfile \
            --tag "aerodeck/dashboard:${GITHUB_SHA}" \
            apps/dashboard

  push:
    name: push to DigitalOcean Container Registry
    needs: build
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check registry credentials
        id: creds
        env:
          DOCR_TOKEN: ${{ secrets.DOCR_TOKEN }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          set -euo pipefail
          token="${DOCR_TOKEN:-${DIGITALOCEAN_TOKEN:-}}"
          if [ -z "${token}" ]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::DOCR_TOKEN / DIGITALOCEAN_TOKEN is not set; skipping image push."
            exit 0
          fi
          echo "ready=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build, tag, and push dashboard-SHA + dashboard-main
        if: steps.creds.outputs.ready == 'true'
        env:
          DOCR_TOKEN: ${{ secrets.DOCR_TOKEN }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          set -euo pipefail
          token="${DOCR_TOKEN:-${DIGITALOCEAN_TOKEN}}"
          registry="${DOCR_NAME:-aerodeck}"
          image="registry.digitalocean.com/${registry}/${IMAGE_REPO}"
          docker build \
            --file apps/dashboard/Dockerfile \
            --tag "${image}:dashboard-${GITHUB_SHA}" \
            --tag "${image}:dashboard-main" \
            apps/dashboard
          echo "${token}" | docker login registry.digitalocean.com \
            --username "${token}" \
            --password-stdin
          python3 apps/control-plane/scripts/prune_docr_images.py \
            --registry "${registry}" \
            --repository "${IMAGE_REPO}" \
            --keep 2
          docker push "${image}:dashboard-${GITHUB_SHA}"
          docker push "${image}:dashboard-main"
          python3 apps/control-plane/scripts/prune_docr_images.py \
            --registry "${registry}" \
            --repository "${IMAGE_REPO}" \
            --keep 2

  deploy:
    name: deploy to control Droplet
    needs: push
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
      && vars.DEPLOY_DASHBOARD_SELF_HOSTED == 'true'
      && vars.CONTROL_DROPLET_HOST != ''
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Pull image and restart aerodeck-dashboard on Droplet
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
          DOCR_TOKEN: ${{ secrets.DOCR_TOKEN }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          CONTROL_DROPLET_HOST: ${{ vars.CONTROL_DROPLET_HOST }}
          CONTROL_SSH_KEY_PATH: ${{ vars.CONTROL_SSH_KEY_PATH }}
        run: |
          set -euo pipefail
          token="${DOCR_TOKEN:-${DIGITALOCEAN_TOKEN:-}}"
          registry="${DOCR_NAME:-aerodeck}"
          image="registry.digitalocean.com/${registry}/${IMAGE_REPO}:dashboard-main"
          key_path="${CONTROL_SSH_KEY_PATH:-$HOME/.ssh/aerodeck_ed25519}"
          ssh_opts=(-i "${key_path}" -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15)
          scp "${ssh_opts[@]}" \
            apps/control-plane/scripts/start-dashboard-on-droplet.sh \
            "root@${CONTROL_DROPLET_HOST}:/root/start-dashboard-on-droplet.sh"
          printf '%s' "${token}" | ssh "${ssh_opts[@]}" "root@${CONTROL_DROPLET_HOST}" \
            "umask 077; tok=\$(cat); chmod +x /root/start-dashboard-on-droplet.sh; DOCR_TOKEN=\"\${tok}\" bash /root/start-dashboard-on-droplet.sh '${image}'"
