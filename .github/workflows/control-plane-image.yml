name: Control plane image

# Build apps/control-plane on every PR. Push to DigitalOcean Container
# Registry only from main: an immutable git-SHA tag plus a floating `main`
# tag. Pull requests never push `main` (or any other tag).
#
# Until DIGITALOCEAN_TOKEN is set, the push job skips so pull requests stay
# green. Procedure: docs/runbooks/control-plane-image.md

on:
  pull_request:
    paths:
      - "apps/control-plane/**"
      - ".github/workflows/control-plane-image.yml"
      - "packages/iac-engine/tests/test_image_publish.py"
      - "packages/iac-engine/stacks/tenant/**"
  push:
    branches: [main]
    paths:
      - "apps/control-plane/**"
      - ".github/workflows/control-plane-image.yml"
      - "packages/iac-engine/tests/test_image_publish.py"
      - "packages/iac-engine/stacks/tenant/**"

permissions:
  contents: read

concurrency:
  group: control-plane-image-${{ github.ref }}
  cancel-in-progress: true

env:
  # Override with repo variable DOCR_NAME if the registry is not "aerodeck".
  DOCR_NAME: ${{ vars.DOCR_NAME }}
  IMAGE_REPO: control-plane
  DOCKER_BUILDKIT: "1"

jobs:
  build:
    name: build image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Workflow and Dockerfile shape
        run: python packages/iac-engine/tests/test_image_publish.py

      - name: Build
        run: |
          set -euo pipefail
          docker build \
            --file apps/control-plane/Dockerfile \
            --tag "aerodeck/${IMAGE_REPO}:${GITHUB_SHA}" \
            .

  push:
    name: push to DigitalOcean Container Registry
    needs: build
    if: >-
      github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check registry credentials
        id: creds
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DIGITALOCEAN_TOKEN}" ]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::DIGITALOCEAN_TOKEN is not set; skipping image push. See docs/runbooks/control-plane-image.md"
            exit 0
          fi
          echo "ready=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build, tag, and push SHA + main
        if: steps.creds.outputs.ready == 'true'
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          set -euo pipefail
          registry="${DOCR_NAME:-aerodeck}"
          image="registry.digitalocean.com/${registry}/${IMAGE_REPO}"
          docker build \
            --file apps/control-plane/Dockerfile \
            --tag "${image}:${GITHUB_SHA}" \
            --tag "${image}:main" \
            .
          echo "${DIGITALOCEAN_TOKEN}" | docker login registry.digitalocean.com \
            --username "${DIGITALOCEAN_TOKEN}" \
            --password-stdin
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:main"
