name: Control plane tests

# Runs the FastAPI test suite twice: once on SQLite (fast, no services) and
# once against PostgreSQL with the asyncpg driver the service ships with.
# The Alembic migration is also applied, rolled back, and re-applied on
# PostgreSQL so a broken migration fails the pull request, not the deploy.

on:
  pull_request:
    paths:
      - "apps/control-plane/**"
      - ".github/workflows/control-plane-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/control-plane/**"
      - ".github/workflows/control-plane-tests.yml"

permissions:
  contents: read

concurrency:
  group: control-plane-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Required by Settings at import time. Not a secret: CI never issues real tokens.
  AERODECK_AUTH_SIGNING_KEY: ci-only-signing-key-not-a-secret-0123456789
  POSTGRES_URL: postgresql+asyncpg://aerodeck:aerodeck@localhost:5432/aerodeck

jobs:
  test:
    name: pytest (SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/control-plane

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aerodeck
          POSTGRES_PASSWORD: aerodeck
          POSTGRES_DB: aerodeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aerodeck -d aerodeck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/control-plane/requirements.txt
            apps/control-plane/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests on SQLite
        run: python -m pytest -q

      - name: Tests on PostgreSQL
        env:
          AERODECK_TEST_DATABASE_URL: ${{ env.POSTGRES_URL }}
        run: python -m pytest -q

      - name: Migration round-trip on PostgreSQL
        env:
          AERODECK_DATABASE_URL: ${{ env.POSTGRES_URL }}
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current
