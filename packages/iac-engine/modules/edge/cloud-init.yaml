#cloud-config
# Traefik v3 edge host. Polls the control plane over the VPC. Does not start
# the control-plane container. Token is generated by Terraform (sensitive output).
package_update: true
packages:
  - docker.io
  - ca-certificates
write_files:
  - path: /etc/aerodeck/traefik.yml
    owner: root:root
    permissions: "0600"
    content: |
      entryPoints:
        web:
          address: ":80"
        websecure:
          address: ":443"
      providers:
        http:
          endpoint: "http://${control_plane_private_ipv4}:8000/api/v1/edge/traefik"
          pollInterval: "5s"
          headers:
            Authorization: "Bearer ${traefik_provider_token}"
      log:
        level: INFO
  - path: /etc/aerodeck/traefik-image
    owner: root:root
    permissions: "0644"
    content: |
      ${traefik_image}
runcmd:
  - [systemctl, enable, --now, docker]
  - docker pull ${traefik_image}
  - docker rm -f aerodeck-edge || true
  - docker run -d --restart unless-stopped --name aerodeck-edge --network host -v /etc/aerodeck/traefik.yml:/etc/traefik/traefik.yml:ro ${traefik_image}
