#cloud-config
# Control-plane host. CI publishes the image to DigitalOcean Container Registry
# (git SHA + floating main). This module writes that reference on disk; it does
# not log in to the registry or start the container (no token on the host).
package_update: true
packages:
  - docker.io
  - ca-certificates
write_files:
  - path: /etc/aerodeck/control-plane-image
    owner: root:root
    permissions: "0644"
    content: |
      ${control_plane_image}
runcmd:
  - [systemctl, enable, --now, docker]
%{ if !managed_cache_enabled ~}
  - docker run -d --restart unless-stopped --name aerodeck-redis --publish 127.0.0.1:6379:6379 redis:7-alpine
%{ endif ~}
